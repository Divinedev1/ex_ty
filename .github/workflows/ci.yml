name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to deploy; leave empty to publish and deploy this commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pets
          POSTGRES_PASSWORD: pets
          POSTGRES_DB: pets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pets -d pets"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: secretpassword
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pets:pets@localhost:5432/pets
      REDIS_URL: redis://127.0.0.1:6379/15
      RABBITMQ_URL: amqp://admin:secretpassword@localhost:5672
      BROKER_ENABLED: "true"
      JWT_SECRET: ci-only-secret-for-github-actions-000000000000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Tests and coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  publish:
    name: Publish image
    needs: test
    if: |
      github.ref == 'refs/heads/master' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: publish-master
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/divinedev1/ex_ty

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [test, publish]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (
        needs.publish.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deploy files
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            compose.prod.yaml nginx.conf Caddyfile deploy/deploy.sh \
            "$VPS_USER@$VPS_HOST:/opt/ex_ty/"

      - name: Deploy
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "chmod +x /opt/ex_ty/deploy.sh && /opt/ex_ty/deploy.sh '$IMAGE_TAG'"

      - name: Smoke test
        run: |
          attempt=1
          while [ "$attempt" -le 24 ]; do
            if curl -fsS "$PRODUCTION_URL/health/ready"; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "production health check failed" >&2
          exit 1
